<mat-card>
  <mat-card-header class="header-card">Buscar productos</mat-card-header>
  <mat-card-content>
    <form [formGroup]="searchForm" class="search-row">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="q" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Categoría</mat-label>
        <mat-select formControlName="category">
          <mat-option value="">Todas</mat-option>
          @for (cat of categories; track cat) {
            <mat-option [value]="cat">{{ categoryLabels[cat] }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </form>

    <table mat-table [dataSource]="products" class="full-width">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Producto</th>
        <td mat-cell *matCellDef="let p">{{ p.name }} <span class="category-name">({{ categoryLabels[p.category] }})</span></td>
      </ng-container>
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Precio</th>
        <td mat-cell *matCellDef="let p">{{ p.price | currency:'ARS':'symbol-narrow':'1.2-2' }}</td>
      </ng-container>
      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Agregar</th>
        <td mat-cell *matCellDef="let p">
          <button mat-stroked-button color="primary" [disabled]="disabled" (click)="onAdd(p)">
            +
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card-content>
</mat-card>
