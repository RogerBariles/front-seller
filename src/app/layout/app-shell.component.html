<mat-sidenav-container class="shell">
  <mat-sidenav #drawer mode="over" class="sidenav">
    <mat-toolbar color="primary">Lo'Postigli</mat-toolbar>
    <mat-nav-list>
      @for (item of navItems(); track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active" (click)="drawer.close()">
          {{ item.label }}
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="topbar">
      <button mat-icon-button (click)="drawer.toggle()" aria-label="Menú">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="title">Lo'Postigli</span>
      <span class="spacer"></span>
      @if (user(); as u) {
        @if (u.companyName) {
          <span class="company-info hide-mobile">{{ u.companyName }}</span>
        }
        <span class="user-info hide-mobile">{{ u.name }}</span>
        <button mat-button (click)="logout()">Salir</button>
      }
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
